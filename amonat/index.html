function feedHtml(f){if(!f.length)return `<div class="note">Пока нет операций.</div>`;
  const ic={join:["p-good","Подключение"],don:["p-good","Пожертвование"],pay:["p-acc","Оплата"],acc:["p-gold","Начисление"],ret:["p-good","Возврат партнёра"],flag:["p-bad","Проверка"]};
  return `<div class="list">${f.map(x=>`<div class="item"><div class="who"><div class="name" style="font-weight:500">${esc(x.t)}</div><div class="meta"><span class="pill ${ic[x.k][0]}">${ic[x.k][1]}</span> · день ${x.d}</div></div>${x.a?`<div class="amt">${x.k==="pay"?"−":x.k==="flag"?"":"+"}${m(x.a)}</div>`:""}</div>`).join("")}</div>`}
function verify(r){r.since=S.day;r.lastBuy=S.day;r.verifiedDay=S.day;if(canAdmit(r)){r.status="ok";toast(`${r.name}: подключён к кошельку`)}else{r.status="wait";log("flag",`${r.name}: в листе ожидания, не хватает резерва`,0,r.id);toast(`${r.name}: проверен, но фонд пока не потянет. Добавлен в очередь`)}log("join",`${r.name}: документы проверены (${r.docs.length})`,0,r.id);save();render()}
/* ---------- ДОКУМЕНТЫ ---------- */
function readDoc(f,kind){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{
  if(!f.type.startsWith("image/"))return res({kind,name:f.name,size:f.size,day:S.day});
  const i=new Image();i.onerror=rej;i.onload=()=>{const sc=Math.min(1,1000/Math.max(i.width,i.height));const c=document.createElement("canvas");c.width=Math.round(i.width*sc);c.height=Math.round(i.height*sc);c.getContext("2d").drawImage(i,0,0,c.width,c.height);res({kind,name:f.name,img:c.toDataURL("image/jpeg",.72),day:S.day})};i.src=fr.result};fr.readAsDataURL(f)})}
function docsHtml(list,owner){if(!list.length)return`<div class="note">Документов пока нет.</div>`;
  return list.map((d,i)=>`<div class="doc">${d.img?`<img src="${d.img}" alt="${esc(d.kind)}" data-zoom="${i}">`:`<div class="ph">${(d.name.split(".").pop()||"файл").toUpperCase()}</div>`}<div class="cap"><b>${esc(d.kind)}</b><span>${esc(d.name)}${d.demo?" · пример":""}</span><span>день ${d.day}</span>${owner?`<button class="btn small ghost" data-rm="${i}">Убрать</button>`:""}</div></div>`).join("")}
function bindDocs(root,list,after){root.querySelectorAll("[data-zoom]").forEach(im=>im.onclick=()=>{const z=$("#zoom");z.innerHTML=`<img src="${list[+im.dataset.zoom].img}" alt="">`;z.hidden=false});
  root.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{list.splice(+b.dataset.rm,1);save();after&&after()})}
function openDocs(id){const r=R(id),md=$("#modal");
  const draw=()=>{md.innerHTML=`<div class="sheet" role="dialog" aria-label="Документы">
    <div class="row between"><h2>${esc(r.name)}</h2><button class="btn small ghost" id="mClose">Закрыть</button></div>
    <div class="note">${CATS[r.cat]} · Нужда: ${NEED[r.need]} · ${esc(r.note)}</div>
    <div class="docs" id="mDocs">${docsHtml(r.docs,r.id)}</div>
    <div class="upload"><div class="grid2"><label>Тип документа<select id="mKind">${DOCKINDS.map(k=>`<option>${k}</option>`).join("")}</select></label><label>Добавить фото или файл<input id="mFiles" type="file" accept="image/*,application/pdf" multiple></label></div></div>
    ${r.status==="check"?`<div class="card" style="padding:12px;gap:4px"><h3>Комиссия · нужно 3 голоса «за»</h3>
      ${COMMISSION.map(([k,n])=>`<div class="vote"><span>${n}</span><span class="chips"><button class="chip" data-vote="${k}:1" aria-pressed="${r.votes[k]===true}">За</button><button class="chip" data-vote="${k}:0" aria-pressed="${r.votes[k]===false}">Против</button></span></div>`).join("")}
      <label style="margin-top:6px">Уровень помощи<select id="mLvl">${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${k===r.lvl?"selected":""}>${v}</option>`).join("")}</select></label></div>
      <div class="row"><button class="btn" id="mVerify" ${r.docs.length&&COMMISSION.every(([k])=>r.votes[k]===true)?"":"disabled"}>Назначить помощь</button><button class="btn ghost" id="mReject">Отклонить</button></div>
      <div class="note">${!r.docs.length?"Сначала нужен хотя бы один документ. ":""}Если двое против — заявка отклоняется автоматически.</div>`:`<div class="note">Статус: ${r.status==="ok"?"получает помощь":r.status==="wait"?"в листе ожидания":"на проверке"}. Документы хранятся для повторной проверки.</div>`}
  </div>`;
    $("#mClose").onclick=()=>{md.hidden=true;md.innerHTML="";render()};
    bindDocs($("#mDocs"),r.docs,draw);
    $("#mFiles").onchange=async e=>{const fs=[...e.target.files];for(const f of fs){try{r.docs.push(await readDoc(f,$("#mKind").value))}catch(_){toast(`Не удалось прочитать ${f.name}`)}}save();draw()};
    if($("#mVerify"))$("#mVerify").onclick=()=>{md.hidden=true;md.innerHTML="";verify(r)};
    md.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>{const[k,v]=b.dataset.vote.split(":");r.votes[k]=v==="1";
      if(COMMISSION.filter(([q])=>r.votes[q]===false).length>=2){S.recipients=S.recipients.filter(x=>x!==r);log("flag",`${r.name}: комиссия отклонила заявку`,0);md.hidden=true;md.innerHTML="";save();render();return toast("Двое против: заявка отклонена")}
      save();draw()});
    if($("#mLvl"))$("#mLvl").onchange=e=>{r.lvl=e.target.value;save()};
    if($("#mReject"))$("#mReject").onclick=()=>{S.recipients=S.recipients.filter(x=>x!==r);log("flag",`${r.name}: заявка отклонена`,0);md.hidden=true;md.innerHTML="";save();render();toast("Заявка отклонена")};
  };draw();md.hidden=false;md.onclick=e=>{if(e.target===md){md.hidden=true;md.innerHTML="";render()}}}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#zoom").hidden=true;}});
document.getElementById("zoom").onclick=()=>$("#zoom").hidden=true;
function doAccrue(){const g=accrue();save();render();toast(g.k<1||g.Kc<1?`Денег мало: больным ${pct(g.Kc)}, остальным ${pct(g.k)} нормы`:g.k>1?`Денег хватает: все получили ${pct(g.k)} нормы, ${m(g.given)}`:`Начислено ${m(g.given)}`+(g.kept?`, ${m(g.kept)} оставлено для других`:""))}
function bindOverview(){

    S.mr.sp.push({n,a,d:S.day,c:$("#spCamp").value.trim()});S.mr.bal+=a;S.raised+=a;addDon(a,"На удвоение",n,true);log("don",`${n}: в резерв удвоения`,a);save();render();toast(`${n} добавлен: +${m(a)} в резерв удвоения`)};
  $("#addR").onclick=()=>{
    const name=$("#nName").value.trim();if(!name)return toast("Укажите имя");
    if(!ui.newDocs.length)return toast("Прикрепите хотя бы один документ");
    S.recipients.push({docs:ui.newDocs,id:"r"+Date.now(),name,city:$("#nCity").value.trim()||"Душанбе",cat:$("#nCat").value,note:$("#nNote").value.trim()||"Документы загружены",daily:Math.max(5,+$("#nDaily").value||30),need:+$("#nNeed").value||3,since:S.day,target:Math.max(0,+$("#nTarget").value||0),bal:0,status:"check",bank:"Алиф",pending:[],tx:[],paused:false,reviewed:0,hold:0,lastBuy:S.day,lvl:$("#nLvl").value,votes:{},pin:"1234",card:{no:cardNo("n"),blocked:false},proxy:"",verifiedDay:0,tries:0});
    ui.newDocs=[];save();render();toast("Заявка отправлена комиссии: вкладка «Проверки»");
  };
}

function bindWatch(){

function impact(a){const net=S.topUp?a:a-opsOf(a),days=Math.floor(net/30),meals=Math.floor(net/MEAL);
  return days>=1?`Ваши ${m(a)} — это ${days} ${days===1?"день":days<5?"дня":"дней"} помощи одному человеку (продукты или лекарства)${meals>=1?` или ${meals} ${meals===1?"горячий обед":meals<5?"горячих обеда":"горячих обедов"}`:""}.`:`Даже ${m(a)} помогают: из маленьких взносов складываются большие суммы.`}
/* Сколько ещё удвоят этому донору в текущем месяце */
function dblLeft(){if(S.day-S.myDblFrom>=30){S.myDbl=0;S.myDblFrom=S.day}return Math.max(0,S.cfg.dblCap-S.myDbl)}
function donate(a,purpose,name,guest,from){
  const ops=opsOf(a),top=S.topUp&&!guest,toPeople=top?a:a-ops,charge=top?a+ops:a;
  const mAdd=Math.min(S.mr.bal,toPeople,guest?S.cfg.dblCap:dblLeft());
  S.pool+=toPeople+mAdd;S.ops+=ops;S.raised+=charge;S.mr.bal-=mAdd;S.mr.used+=mAdd;
  if(!guest){S.myGiven+=charge;S.myLeft+=toPeople+mAdd;S.myDbl+=mAdd}
  log("don",`Пожертвование · ${purpose.toLowerCase()}${name?" · от имени: "+name:""}${from?" · "+from:""}`,charge);
  if(mAdd)log("don","Удвоение из резерва удвоения",mAdd);
  if(guest)addDon(charge,purpose,"Гость: "+name,false);else addDon(charge,purpose);

  return s+fin(0,0)+fin(14,0)+fin(0,14)+"</svg>"}

function prisk(p){
  const sig=[],pays=S.feed.filter(x=>x.k==="pay"&&x.pid===p.id&&x.id);
  const late=pays.filter(x=>!x.chk&&S.day-x.d>1).length;
  if(late)sig.push([Math.min(45,15*late),`${late} оплат без чека больше суток`]);
  const g={};pays.filter(x=>x.d>S.day-7).forEach(x=>{const k=x.rid+"|"+x.a;(g[k]=g[k]||new Set()).add(x.d)});
  Object.entries(g).forEach(([k,d])=>{if(d.size>=3){const[rid,a]=k.split("|");sig.push([30,`Получатель №${anon(rid)} платит ровно ${m(+a)} уже ${d.size} дн.`])}});
  const loyal=S.recipients.filter(r=>{const t=r.tx.filter(t=>t.pid&&t.d>S.day-14);return t.length>=4&&t.every(t=>t.pid===p.id)}).length;
  if(loyal>=2)sig.push([15,`${loyal} получателей покупают только здесь`]);
  S.mystery.filter(x=>x.pid===p.id&&!x.ok&&x.d>S.day-30).forEach(x=>sig.push([40,"Тайный покупатель: "+x.t]));
  const score=Math.min(100,sig.reduce((s,x)=>s+x[0],0));
  return{score,lvl:score>=60?"high":score>=30?"mid":"low",sig};
}

      ${k.sig.map(x=>`<div class="meta" style="color:var(--${k.lvl==="high"?"bad":"warn"})">• ${esc(x[1])}</div>`).join("")}
      <div class="chips" style="margin-top:6px">${p.state==="ok"?`<button class="btn small ghost" data-pst="${p.id}:warn">Предупредить</button>`:""}${p.state==="ok"||p.state==="warn"?`<button class="btn small ghost" data-pst="${p.id}:frozen">Заморозить выплаты</button>`:""}${p.state!=="out"?`<button class="btn small ghost" data-pst="${p.id}:out">Исключить</button>`:""}${p.state!=="ok"?`<button class="btn small" data-pst="${p.id}:ok">Проверил, всё чисто</button>`:""}</div>
    </div></div>`).join("")}</div>

  </div>
  <div class="card">
    <div class="row between"><h2>Тайный покупатель</h2><button class="btn small" id="mystery">Отправить на проверку</button></div>

    ${S.mystery.length?`<div class="list">${S.mystery.slice(0,6).map(x=>`<div class="item"><div class="who"><div class="name" style="font-weight:500">${esc((P(x.pid)||{name:""}).name)}</div><div class="meta">день ${x.d}</div></div><span class="pill ${x.ok?"p-good":"p-bad"}">${x.ok?"Нарушений нет":esc(x.t)}</span></div>`).join("")}</div>`:""}
  </div>

    <div class="note">Через ${S.cfg.remind} дн. без покупок волонтёр проверяет, всё ли в порядке (человек может быть в больнице). Через ${S.cfg.expire} дн. баланс возвращается в общий фонд тем, кто ждёт. Цель на лечение не сгорает.</div>
  </div>

  </div>

}
function bindCheck(){
  document.querySelectorAll("[data-docs]").forEach(b=>b.onclick=()=>openDocs(b.dataset.docs));
  document.querySelectorAll("[data-pst]").forEach(b=>b.onclick=()=>{const[id,st]=b.dataset.pst.split(":"),p=P(id);
    const why={warn:"Предупреждение: нарушены правила оплат",frozen:"Выплаты заморожены на время проверки",out:"Исключён из сети за нарушения",ok:""}[st];
    if(st==="ok"){S.feed.filter(x=>x.k==="pay"&&x.pid===p.id&&!x.chk).forEach(x=>x.chk={no:"сверено фондом",d:S.day});S.mystery=S.mystery.filter(x=>x.pid!==p.id||x.ok)}
    p.state=st;p.why=why;log(st==="ok"?"join":"flag",`${p.name}: ${PSTATE[st][1].toLowerCase()}`,0);save();render();toast(`${p.name}: ${PSTATE[st][1].toLowerCase()}`)});
  $("#mystery").onclick=()=>{const live=S.partners.filter(p=>p.state!=="out");if(!live.length)return toast("Нет партнёров");
    const p=live[S.mystery.length%live.length],ok=Math.random()>.25,t=ok?"":MYSTERY_BAD[Math.floor(Math.random()*MYSTERY_BAD.length)];
    S.mystery.unshift({pid:p.id,d:S.day,ok,t});log("flag",`Тайный покупатель в «${p.name.replace(/^.*«|»$/g,"")}»: ${ok?"нарушений нет":t}`,0);save();render();toast(ok?`${p.name}: нарушений нет`:`${p.name}: ${t}`)};
  $("#scnCash").onclick=()=>{const r=R("r3")||S.recipients.find(x=>x.status==="ok"),p=P("p2")||S.partners[0];
    for(let k=4;k>=1;k--){const d=S.day-k;r.tx.push({d,a:50,pid:p.id,max:true});S.feed.unshift({k:"pay",id:"s"+Date.now()+k,t:`${r.name} · ${p.name}`,a:50,d,rid:r.id,pid:p.id,cat:"Продукты",how:"card",chk:null});p.total+=50;p.n++;S.spent+=50;S.spentBy[p.type]+=50}
    save();render();toast(`${p.name}: 4 дня подряд ровно 50 смн от одного человека и без чеков`)};
}

/* ---------- ПУБЛИЧНЫЙ ОТЧЁТ ---------- */

      <div class="item"><span>Ждёт распределения в фонде</span><span class="amt">${m(S.pool)}</span></div>

      <div class="item"><span>Работа фонда ${S.cfg.ops==="sponsor"?`(оплачивает ${esc(S.cfg.opsSponsor||"спонсор")})`:`(сейчас ${S.cfg.opsPct}% от взносов)`}</span><span class="amt">${m(S.ops)}</span></div>

const V={check:[vCheck,bindCheck],rules:[vRules,bindRules],notes:[vNotes,bindNotes],report:[vReport,()=>{}],overview:[vOverview,bindOverview],watch:[vWatch,bindWatch],donate:[vDonate,bindDonate],wallet:[vWallet,bindWallet],pay:[vPay,bindPay],partner:[vPartner,bindPartner]};
