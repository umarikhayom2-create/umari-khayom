<script>
const TABS=[["overview","Фонд"],["watch","Наблюдение"],["donate","Донору"],["wallet","Получателю"],["pay","Оплата QR"],["partner","Партнёрам"]];
const CATS={health:"Болезнь / лекарства",disability:"Инвалидность",lowincome:"Малоимущая семья",elderly:"Одинокий пожилой"};
const PTYPES={pharmacy:"Аптека",shop:"Магазин",canteen:"Столовая"};
const OPS_SHARE=0.10;
/* Правила распределения */
const RULE={tiers:[[14,1],[30,.5],[45,.25]],unlock:1,hold:3,bigMul:5,maxPerDay:3,manual:1000,idle:30,reserve:60,warn:30,roundPer:0.4,maxK:1.2,minKc:.5,minKo:.3};
const DOCKINDS=["Справка об инвалидности","Заключение врача","Рецепт","Справка о доходах","Справка из махалли","Паспорт","Фото условий жизни","Другое"];
const NEED=["","Низкая","Ниже средней","Средняя","Высокая","Критическая"];

function seed(){return{
  day:1,pool:18450,ops:2050,raised:20500,saved:0,roundUsers:0,subs:0,subsN:0,lastK:1,cashUsers:0,juma:0,jumaN:0,payroll:0,payrollN:0,meals:0,mealsGiven:0,events:[],me:{name:"",pub:false},donations:[{who:"Шерзод Р.",pub:true,a:1000,purpose:"Закят",d:1},{who:"Дилноза К.",pub:false,a:500,purpose:"На лекарства",d:1},{who:"ООО «Нури Субҳ»",pub:true,a:5000,purpose:"Общая помощь",d:1},{who:"Фирӯз А.",pub:true,a:300,purpose:"Садака",d:1}],myGiven:0,mr:{bal:3000,ret:3000,sp:[],used:0},cert:null,
  recipients:[
    {id:"r1",docs:[{kind:"Заключение врача",name:"заключение_эндокринолог.pdf",demo:1,day:1},{kind:"Рецепт",name:"рецепт_инсулин.jpg",demo:1,day:1}],need:5,name:"Зарина М.",city:"Душанбе",cat:"health",note:"Нужен инсулин каждый месяц",daily:40,bal:310,target:600,status:"ok",bank:"Алиф"},
    {id:"r2",docs:[{kind:"Справка об инвалидности",name:"справка_МСЭК.pdf",demo:1,day:1}],need:4,name:"Бахтиёр Н.",city:"Хуҷанд",cat:"disability",note:"Инвалидность I группы",daily:35,bal:120,status:"ok",bank:"Душанбе Сити"},
    {id:"r3",docs:[{kind:"Справка о доходах",name:"справка_доход.pdf",demo:1,day:1},{kind:"Справка из махалли",name:"махалля.jpg",demo:1,day:1}],need:4,name:"Семья Каримовых",city:"Бохтар",cat:"lowincome",note:"5 детей, мать одна",daily:50,bal:85,status:"ok",bank:"Алиф"},
    {id:"r4",docs:[{kind:"Справка из махалли",name:"махалля.jpg",demo:1,day:1}],need:3,name:"Мавлуда Р.",city:"Душанбе",cat:"elderly",note:"Пенсионерка, живёт одна",daily:25,bal:420,status:"ok",bank:"Алиф"},
    {id:"r5",docs:[{kind:"Заключение врача",name:"выписка_операция.pdf",demo:1,day:1}],need:4,name:"Фаррух С.",city:"Кӯлоб",cat:"health",note:"Восстановление после операции",daily:30,bal:0,target:400,status:"check",bank:"Алиф"}
  ].map(r=>({docs:[],target:0,pending:[],tx:[],paused:false,reviewed:0,hold:0,lastBuy:1,...r})),
  partners:[
    {id:"p1",name:"Аптека «Дармон»",type:"pharmacy",paid:0,count:0,returned:0,closed:false},
    {id:"p2",name:"Маркет «Нону Намак»",type:"shop",paid:0,count:0,returned:0,closed:false},
    {id:"p3",name:"Ошхона «Дастархон»",type:"canteen",paid:0,count:0,returned:0,closed:false}
  ],
  feed:[{k:"don",t:"Пожертвование · закят",a:1000,d:1},{k:"don",t:"Пожертвование · на лекарства",a:500,d:1}]
}}
let S;
try{S=JSON.parse(localStorage.getItem("amonat-v3"))}catch(e){}
if(!S||!S.recipients)S=seed();
if(!S.mr){S.mr={bal:0,ret:0,sp:[],used:0};delete S.match}
function save(){try{localStorage.setItem("amonat-v3",JSON.stringify(S))}catch(e){if(!save.warned){save.warned=1;setTimeout(()=>toast("Память браузера заполнена: файлы сохранятся до перезагрузки страницы"),400)}}}
const $=s=>document.querySelector(s);
const m=n=>Math.round(n).toLocaleString("ru-RU").replace(/,/g," ")+" смн";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,3000)}
function log(k,t,a,rid){S.feed.unshift({k,t,a,d:S.day,rid});S.feed=S.feed.slice(0,80)}
const R=id=>S.recipients.find(r=>r.id===id);const P=id=>S.partners.find(p=>p.id===id);

/* ---------- ДВИЖОК ---------- */
const pend=r=>r.pending.reduce((s,x)=>s+x.a,0);
const stock=r=>(r.bal+pend(r))/r.daily;
function tier(r){
  if(r.status!=="ok")return{k:0,why:"Документы на проверке"};
  if(r.paused)return{k:0,why:"Пауза до проверки оператором"+(r.pauseWhy?": "+r.pauseWhy:"")};
  const tot=r.bal+pend(r);
  if(r.target&&tot<r.target)return{k:1,why:`Копит на лечение: ${m(tot)} из ${m(r.target)}`};
  const d=stock(r);
  for(const[lim,k]of RULE.tiers)if(d<=lim)return{k,why:k===1?`Запас ${Math.round(d)} дн.: полная норма`:`Запас ${Math.round(d)} дн.: норма ${k*100}%`};
  return{k:0,why:`Запас ${Math.round(d)} дн.: начисление остановлено`};
}
function risk(r){
  const from=Math.max(S.day-7,r.reviewed);const w=r.tx.filter(t=>t.d>from);const sig=[];
  const maxs=w.filter(t=>t.max&&!t.flag&&!t.med&&t.a>=r.daily).length;
  if(maxs>=3)sig.push([15*maxs,`${maxs} раз(а) за неделю сразу тратил весь баланс`]);
  const bigs=w.filter(t=>t.big).length;
  if(bigs)sig.push([20*bigs,`Крупные покупки не по назначению: ${bigs}`]);
  const by={};w.filter(t=>t.d>S.day-5&&t.pid&&!t.med).forEach(t=>by[t.pid]=(by[t.pid]||0)+1);
  const top=Math.max(0,...Object.values(by));if(top>=5&&maxs>=3)sig.push([15,`${top} раз за 5 дней в одном месте, всегда на всю сумму`]);
  const fl=w.filter(t=>t.flag).length;if(fl)sig.push([25*fl,"Попытка оплаты больше 1 000 смн"]);
  if(r.status==="ok"&&S.day-r.lastBuy>=RULE.idle&&r.bal>0)sig.push([10,"Не пользуется 30+ дней: уточнить, нужна ли помощь"]);
  const score=Math.min(100,sig.reduce((s,x)=>s+x[0],0));
  return{score,lvl:score>=60?"high":score>=30?"mid":"low",sig};
}
const todayCount=r=>r.tx.filter(t=>t.d===S.day&&!t.flag).length;

const crit=r=>r.cat==="health"||r.cat==="disability";
const burn=extra=>S.recipients.filter(r=>r.status==="ok"&&!r.paused).reduce((s,r)=>s+r.daily*tier(r).k,0)+(extra||0);
const MEAL=25;
const inflowParts=()=>[["Округление покупок",S.roundUsers*RULE.roundPer],["Кэшбэк в фонд",S.cashUsers*0.15],["Джума-садака",S.juma/7],["Подписки",S.subs/30],["1% от зарплаты",S.payroll/30]];
const inflow=()=>inflowParts().reduce((s,x)=>s+x[1],0);
function daysLeft(extra){const net=burn(extra)-inflow();return net<=0?Infinity:S.pool/net}
const canAdmit=r=>daysLeft(r.daily)>=RULE.reserve;
const waiting=()=>S.recipients.filter(r=>r.status==="wait").sort((a,b)=>b.need-a.need||a.since-b.since);
function admitWaiting(){let n=0;for(const r of waiting()){if(!canAdmit(r))break;r.status="ok";r.lastBuy=S.day;log("join",`${r.name} подключён из листа ожидания`,0,r.id);n++}return n}
/* Динамическая норма: бюджет дня = фонд / ${RULE.reserve} дней + постоянный доход.
   Если денег много, все получают до 120% средней нормы. Если мало: больным не ниже 50%, остальным не ниже 30%. */
function plan(){
  const act=S.recipients.filter(r=>r.status==="ok"&&!r.paused);
  let C=0,O=0;act.forEach(r=>{const w=r.daily*tier(r).k;if(crit(r))C+=w;else O+=w});
  const budget=S.pool/RULE.reserve+inflow();let Kc,Ko;
  if(budget>=C+O){Kc=Ko=C+O?Math.min(RULE.maxK,budget/(C+O)):1}
  else{Kc=budget>=C?1:Math.max(RULE.minKc,C?budget/C:1);Ko=O?Math.min(1,Math.max(RULE.minKo,(budget-C*Kc)/O)):1}
  return{Kc,Ko,budget,C,O};
}
const todayAmt=(r,pl)=>{if(r.status!=="ok")return 0;pl=pl||plan();return Math.floor(r.daily*tier(r).k*(crit(r)?pl.Kc:pl.Ko))};
const big=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace(".",",")+" млн смн":m(n);
const anon=id=>{let h=7;for(const c of String(id))h=(h*31+c.charCodeAt(0))%9000;return h+1000};
const pct=x=>Math.round(x*100)+"%";
function accrue(){
  const inc=Math.round(inflow());if(inc){S.pool+=inc;S.raised+=inc;log("don","Округления и подписки за день",inc)}
  admitWaiting();
  const act=S.recipients.filter(r=>r.status==="ok");
  act.forEach(r=>{const rk=risk(r);if(rk.lvl==="high"&&!r.paused){r.paused=true;r.pauseWhy=rk.sig.map(x=>x[1]).join("; ");log("flag",`${r.name}: начисление на паузе, риск ${rk.score}`,0,r.id)}});
  const full=act.reduce((s,r)=>s+r.daily,0);
  const pl=plan();
  const rows=act.map(r=>({r,want:Math.floor(r.daily*tier(r).k)}));
  const wantAll=rows.reduce((s,x)=>s+x.want,0);
  let rem=S.pool,given=0;
  const give=(r,a)=>{a=Math.min(Math.floor(a),rem);if(a>0){r.pending.push({a,unlock:Math.max(S.day+RULE.unlock,r.hold)});given+=a;rem-=a}};
  rows.filter(x=>crit(x.r)).sort((a,b)=>stock(a.r)-stock(b.r)).forEach(x=>give(x.r,x.want*pl.Kc));
  rows.filter(x=>!crit(x.r)).forEach(x=>give(x.r,x.want*pl.Ko));
  const k=pl.Ko;S.lastK=pl.Ko;S.lastKc=pl.Kc;S.pool-=given;
  const short=Math.max(0,wantAll-given),kept=Math.max(0,full-wantAll);S.saved+=kept;
  log("acc",`День ${S.day}: ${act.length} получателей, коэффициент ${Math.round(pl.Kc*100)}% / ${Math.round(pl.Ko*100)}%`+(kept?`, ${m(kept)} оставлено для других`:""),given);
  S.day++;
  S.recipients.forEach(r=>{const now=r.pending.filter(x=>x.unlock<=S.day);r.bal+=now.reduce((s,x)=>s+x.a,0);r.pending=r.pending.filter(x=>x.unlock>S.day)});
  S.partners.forEach(p=>{p.paid=0;p.count=0;p.returned=0;p.closed=false});
  return{given,kept,short,k,Kc:pl.Kc};
}

function fundBlock(r){
  if(r.status!=="ok")return"Кошелёк на проверке";
  if(r.paused)return"Пауза: фонд проверяет активность";
  if(todayCount(r)>=RULE.maxPerDay)return`Лимит ${RULE.maxPerDay} покупки в день`;
  if(r.bal<=0)return pend(r)?`${m(pend(r))} поступит завтра`:"Баланс пуст";
  return"";
}
function purchase(r,p,a,useFund){
  const fund=useFund&&!fundBlock(r)?Math.min(r.bal,a):0;
  if(fund>RULE.manual){r.tx.push({d:S.day,a:fund,flag:true});log("flag",`${r.name} · ${p.name}: ждёт подтверждения`,fund,r.id);return{fund:0,own:a,flag:true}}
  if(fund){
    const med=p.type==="pharmacy"&&(r.cat==="health"||r.cat==="disability");
    const big=fund>=RULE.bigMul*r.daily&&!med;
    r.tx.push({d:S.day,a:fund,pid:p.id,max:fund>=r.bal*0.95,big,med});
    r.bal-=fund;r.lastBuy=S.day;p.paid+=fund;p.count++;
    if(big)r.hold=S.day+RULE.hold;
    S.feed.unshift({k:"pay",t:`${r.name} · ${p.name}`,a:fund,d:S.day,rid:r.id,pid:p.id});
  }
  return{fund,own:a-fund,flag:false};
}
function simulate(n){
  let tot={given:0,kept:0};
  for(let i=0;i<n;i++){
    const g=accrue();tot.given+=g.given;tot.kept+=g.kept;const d=S.day;
    const buy=(id,pid,amt)=>{const r=R(id);if(r&&r.bal>=10&&!fundBlock(r))purchase(r,P(pid),Math.min(amt,r.bal),true)};
    if(d%5===0)buy("r1","p1",320);
    buy("r2","p2",R("r2").bal);
    buy("r3",d%2?"p2":"p3",45);
    if(d%4===0)buy("r4","p2",60);
    if(d%3===0)buy("r5","p1",80);
  }
  return tot;
}

function impact(a){const net=a-Math.round(a*OPS_SHARE),days=Math.floor(net/30),meals=Math.floor(net/MEAL);

function qrSvg(seedStr){let h=0;for(const c of seedStr)h=(h*31+c.charCodeAt(0))>>>0;
  const n=21;let s=`<svg viewBox="0 0 ${n} ${n}" width="100%" height="100%" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="var(--surface)"/>`;
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="var(--fg)"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="var(--surface)"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="var(--fg)"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;h=(h*1103515245+12345)>>>0;if(h&0x10000)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="var(--fg)"/>`}
  return s+fin(0,0)+fin(14,0)+fin(0,14)+"</svg>"}

    <div class="list"><div class="item"><span>Из фонда «Амонат»</span><span class="amt">${m(rc.fund)}</span></div><div class="item"><span>Из своих</span><span class="amt">${m(rc.own)}</span></div><div class="item"><span>Остаток в фонде</span><span class="amt">${m(rc.left)}</span></div></div>
    ${rc.flag?`<div class="note">Сумма больше 1 000 смн: фонд подтвердит её вручную, чтобы исключить обман.</div>`:rc.hold?`<div class="note">Крупная покупка не в аптеке: новые начисления придут с задержкой до дня ${rc.hold}.</div>`:""}
    <button class="btn" id="again">Новая покупка</button>`}
  return `<div class="panel">
