<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Экран смены · Умари Хайём</title><meta name="robots" content="noindex"><meta name="theme-color" content="#141415">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#141415;--sf:#1e1e20;--tx:#f2f0eb;--mut:#a3a3a9;--ac:#ff8a4c;--ok:#51cf66;--er:#ff7b7b;color-scheme:dark}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.wrap{margin:auto;display:flex;flex-wrap:wrap;gap:clamp(20px,5vw,64px);align-items:center;justify-content:center;max-width:1200px;width:100%}
.qr{background:#fff;padding:clamp(14px,2.4vmin,26px);border-radius:24px;line-height:0;position:relative}
#qr img,#qr canvas{width:min(78vw,62vh);height:min(78vw,62vh);max-width:560px;max-height:560px;image-rendering:pixelated}
.qr.dim #qr{opacity:.15}
.qr .msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#141415;font:700 20px/1.35 system-ui}
.qr.dim .msg{display:flex}
.side{display:grid;gap:14px;max-width:440px;min-width:0}
.brand{font-weight:800;font-size:clamp(20px,2.6vw,28px)}.brand i{color:var(--ac);font-style:normal}
.br{color:var(--mut);font-size:clamp(16px,2vw,20px)}
h1{margin:6px 0 0;font-size:clamp(26px,4vw,44px);line-height:1.1;text-wrap:balance}
.steps{margin:0;padding-left:1.2em;color:var(--mut);display:grid;gap:4px}
.code{font:800 clamp(32px,5vw,54px)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.16em;font-variant-numeric:tabular-nums}
.cl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--sf);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width 1s linear}
.tk{color:var(--mut);font-variant-numeric:tabular-nums}
.st{font-size:14px;color:var(--mut)}.st b{color:var(--ok)}.st.bad b{color:var(--er)}
button{font:600 15px system-ui;border:1px solid #2f2f33;background:var(--sf);color:var(--tx);border-radius:12px;padding:10px 14px;cursor:pointer;justify-self:start}
.setup{max-width:520px;text-align:center;display:grid;gap:12px}.setup p{color:var(--mut);margin:0}
@media (orientation:portrait){.wrap{gap:18px}#qr img,#qr canvas{width:min(80vw,46vh);height:min(80vw,46vh)}.side{gap:10px;justify-items:center;text-align:center}.side button{justify-self:center}h1{font-size:26px}.steps{text-align:left;font-size:16px}.bar{width:100%}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head>
<body>
<div class="wrap" id="app">
  <div class="qr dim" id="qbox"><div id="qr"></div><div class="msg" id="qmsg">Загружаем код…</div></div>
  <div class="side">
    <div><div class="brand">Умари Хайём<i>.</i></div><div class="br" id="brn">Филиал</div></div>
    <h1>Отметьте смену</h1>
    <ol class="steps"><li>Откройте камеру телефона</li><li>Наведите на QR и нажмите на ссылку</li><li>Нажмите «Начать смену» или «Завершить смену»</li></ol>
    <div><div class="cl">Код с экрана</div><div class="code" id="code">— — —</div></div>
    <div class="bar"><i id="bar" style="width:100%"></i></div>
    <div class="tk" id="tk">Код обновляется каждые 30 секунд</div>
    <div class="st" id="st">Подключаемся…</div>
    <button id="fs" type="button">⛶ На весь экран</button>
  </div>
</div>
<script>
var CHAT_URL="https://script.google.com/macros/s/AKfycbzxbho2rc1WmpPRcsMGcKcbxdjH4AgJzxaOU_4R8PvEi5_x45vfRO2vP2nXRR5QKojg/exec";
function $(i){return document.getElementById(i)}
var K={b:"",k:""},S={w:-1,win:30,off:0,code:"",ok:0,t:null},qr=null;
/* ссылка экрана: kiosk.html#b=ФИЛИАЛ&k=КЛЮЧ — запоминаем и убираем из адреса */
(function(){var h=location.hash.slice(1),p={};h.split("&").forEach(function(x){var i=x.indexOf("=");if(i>0)p[x.slice(0,i)]=decodeURIComponent(x.slice(i+1))});
if(p.b&&p.k){K={b:p.b,k:p.k};try{localStorage.setItem("sq_kiosk",JSON.stringify(K))}catch(e){}try{history.replaceState(null,"",location.pathname)}catch(e){}}
else{try{K=JSON.parse(localStorage.getItem("sq_kiosk")||"null")||K}catch(e){}}})();
function setup(t){S.ok=0;clearTimeout(S.t);$("app").innerHTML='<div class="setup"><div class="brand">Умари Хайём<i>.</i></div><h1>Экран смены</h1><p>'+t+'</p></div>'}
function api(pl){return fetch(CHAT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(pl)}).then(function(r){return r.json()})}
function now(){return Date.now()+S.off}
function url(){return new URL("smena.html",location.href).href+"#sq="+K.b+"."+S.w+"."+S.code}
function show(){var u=url();$("qr").innerHTML="";qr=new QRCode($("qr"),{text:u,width:560,height:560,colorDark:"#141415",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
$("code").textContent=S.code.slice(0,3)+" "+S.code.slice(3);$("qbox").classList.remove("dim")}
function dim(t){$("qbox").classList.add("dim");$("qmsg").textContent=t;$("code").textContent="— — —"}
function status(t,bad){var e=$("st");e.className="st"+(bad?" bad":"");e.innerHTML=t}
function pull(){clearTimeout(S.t);var t0=Date.now();
api({a:"z_sqk",b:K.b,k:K.k}).then(function(j){
 if(!j||!j.ok){if(j&&j.error==="kiosk"){try{localStorage.removeItem("sq_kiosk")}catch(e){}setup("Ссылка этого экрана отключена или заменена. Откройте новую ссылку из панели руководителя: «Команда» → «Смена по QR».");return}
  dim(j&&j.error==="action"?"Сервер ещё не обновлён":"Ошибка сервера");status("<b>Ошибка:</b> "+((j&&j.error)||"нет ответа"),1);S.t=setTimeout(pull,8000);return}
 var rt=Date.now()-t0;S.off=j.now+rt/2-Date.now();S.win=j.win||30;S.w=j.w;S.code=j.code;S.ok=1;
 $("brn").textContent=j.nm||"Филиал";show();status("<b>●</b> Работает · обновлено "+new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",second:"2-digit"}));
 var next=(S.w+1)*S.win*1000-now()+400;S.t=setTimeout(pull,Math.max(1000,next))
}).catch(function(){dim("Нет интернета. Ждём связь…");status("<b>●</b> Нет связи с сервером, повторяем",1);S.t=setTimeout(pull,5000)})}
function tick(){if(!S.ok)return;var ms=S.win*1000,left=(S.w+1)*ms-now();
if(left<-15000){dim("Обновляем код…");return}
var s=Math.max(0,Math.ceil(left/1000));$("bar").style.width=Math.min(100,left/ms*100)+"%";$("tk").textContent="Новый код через "+s+" с"}
/* экран не гаснет */
var WL=null;function wake(){try{if(navigator.wakeLock&&!WL)navigator.wakeLock.request("screen").then(function(l){WL=l;l.addEventListener("release",function(){WL=null})}).catch(function(){})}catch(e){}}
document.addEventListener("visibilitychange",function(){if(!document.hidden){wake();pull()}});
if(!K.b||!K.k)setup("Этот экран ещё не подключён к филиалу. Руководитель открывает панель → «Команда» → «Смена по QR» → «Включить экран» и открывает ссылку на этом устройстве.");
else{$("fs").onclick=function(){var d=document.documentElement;try{(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}catch(e){}wake()};
if(!window.QRCode){dim("Не загрузилась библиотека QR. Проверьте интернет и обновите страницу")}else{pull();setInterval(tick,1000);wake()}}
</script>
</body></html>
