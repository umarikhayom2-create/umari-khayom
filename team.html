.card.red{border-color:#dc2626;border-left-color:#dc2626;box-shadow:0 0 0 2px #fecaca}

</style>
</head><body>

<script>
var CHAT_URL="https://script.google.com/macros/s/AKfycbxH7G72oOTHvKqa3ooTjJbgRnJX97JLD4yEmaxRADl6EyBDPHSx6gpYqiVE4FRAUExY/exec";
var S={tok:"",me:null,sh:null,today:0,br:"",at:0};try{S.tok=localStorage.getItem("tm_tok")||""}catch(e){}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function hm(ts){var d=new Date(ts);return("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function dur(m){m=Math.round(m||0);return m<60?m+" мин":Math.floor(m/60)+" ч "+(m%60?(m%60)+" мин":"")}
function toast(t){var e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2600)}

function shrink(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var M=1280,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);var q=.62,d=c.toDataURL("image/jpeg",q);while(d.length>260000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}res(d)};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function login(){$("app").innerHTML='<div class="lg"><h1>👥 Команда</h1><p>Умари Хайём — вход для мерчандайзеров. Логин и пароль выдаёт руководитель.</p><form id="lf"><label>Логин</label><input id="ll" autocapitalize="none" autocomplete="username"><label>Пароль</label><input id="lp" type="password" autocomplete="current-password"><div class="er" id="le"></div><button class="btn" style="width:100%">Войти</button></form><a class="btn o" href="./" style="display:block;margin-top:10px">← На сайт</a></div>';
$("lf").onsubmit=function(e){e.preventDefault();var b=e.target.querySelector("button");b.disabled=true;api({a:"m_login",login:$("ll").value.trim(),pw:$("lp").value}).then(function(j){b.disabled=false;if(!j.ok){$("le").textContent=j.error==="slow"?"Слишком много попыток, подождите 10 минут":j.error==="action"?"Сервер ещё не обновлён — сообщите руководителю":"Неверный логин или пароль";return}S.tok=j.tok;try{localStorage.setItem("tm_tok",j.tok)}catch(x){}setTimeout(qaLoad,800);if("Notification"in window&&Notification.permission==="default")Notification.requestPermission();load()}).catch(function(){b.disabled=false;$("le").textContent="Нет связи с сервером"})}}

var h='<header><div><b>👥 '+esc(m.nm||"")+'</b><small>'+esc(m.rn||"Сотрудник")+(S.br?' · '+esc(S.br):'')+'</small></div><span><a href="./" style="color:#fff;text-decoration:none;font:600 14px system-ui;margin-right:8px">← Сайт</a><button id="out">Выйти</button></span></header><main>';
h+='<div class="board" style="background:'+(s?'linear-gradient(135deg,#22c55e,#15803d)':'linear-gradient(135deg,#8b5cf6,#6d28d9)')+'"><div style="font:600 13px system-ui;opacity:.9">'+(s?'Вы на смене':'Вы не на смене')+'</div><div class="big" style="font-size:44px">'+(s?'с '+hm(s.in):'—')+'</div><div class="hint">Сегодня учтено: <b>'+dur(S.today)+'</b>. Смена учитывается с 08:00 до 23:00; в 23:00 закрывается сама.</div>'+
'<button class="btn" data-sh="'+(s?'out':'in')+'" style="margin-top:12px;width:100%;background:#fff;color:'+(s?'#15803d':'#6d28d9')+'">'+(s?'⏹ Завершить смену':'▶ Пришёл на смену')+'</button></div>';
h+='<div id="qabox">'+qaHtml()+'</div></main>';
$("app").innerHTML=h;$("out").onclick=function(){S.tok="";try{localStorage.removeItem("tm_tok")}catch(x){}login()}}
var PH="";
document.addEventListener("click",function(e){var b=e.target.closest("[data-sh]");if(!b)return;var k=b.dataset.sh;PH="";var d=document.createElement("div");d.className="ov";d.id="sov";
d.innerHTML='<div class="sh"><b style="font-size:19px">'+(k==="in"?"▶ Начало смены":"⏹ Конец смены")+'</b><p class="its">Можно приложить фото (необязательно): торговый зал, полка, место работы.</p><label class="shot"><input type="file" accept="image/*" capture="environment" id="sph" hidden><span id="sst">📷 Сделать фото</span></label><img class="ph" id="sim" hidden alt="Фото"><button class="btn g" id="sgo" style="width:100%;margin-top:10px">'+(k==="in"?"Начать смену":"Завершить смену")+'</button><button class="btn o" id="scx" style="width:100%;margin-top:8px">Отмена</button></div>';
document.body.appendChild(d);$("scx").onclick=function(){d.remove()};
$("sph").onchange=function(){var fl=this.files&&this.files[0];if(!fl)return;$("sst").textContent="⏳ Обрабатываем…";shrink(fl).then(function(u){PH=u;$("sim").src=u;$("sim").hidden=false;$("sst").textContent="🔄 Переснять"}).catch(function(){$("sst").textContent="Не получилось, ещё раз"})};
$("sgo").onclick=function(){var x=this;x.disabled=true;x.textContent="⏳ Сохраняем…";api({a:k==="in"?"m_in":"m_out",tok:S.tok,photo:PH}).then(function(j){d.remove();if(!j.ok){toast("Не получилось: "+j.error);return}toast(k==="in"?(j.early?"Смена начата. До 08:00 не учитывается":"Смена начата ✓"):"Смена завершена · учтено "+dur(j.min));load()}).catch(function(){x.disabled=false;x.textContent="Ещё раз";toast("Нет связи")})}});
var QP="m_q";
/* ===== поручения ===== */
var QA={L:[],me:null,at:0,seen:null,ovd:{},ph:""};
function qaDur(m){m=Math.round(Math.abs(m));return m<60?m+" мин":m<1440?Math.floor(m/60)+" ч"+(m%60?" "+(m%60)+" мин":""):Math.floor(m/1440)+" дн "+Math.round(m%1440/60)+" ч"}
function qaBeep(){try{var C0=window.AudioContext||window.webkitAudioContext,ac=window.__qac||(window.__qac=new C0()),t=ac.currentTime;[880,1175,1568].forEach(function(f,k){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,t+k*.18);g.gain.exponentialRampToValueAtTime(.25,t+k*.18+.02);g.gain.exponentialRampToValueAtTime(.0001,t+k*.18+.16);o.connect(g);g.connect(ac.destination);o.start(t+k*.18);o.stop(t+k*.18+.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function qaNote(t,b){try{if("Notification"in window&&Notification.permission==="granted")new Notification(t,{body:b,icon:"icon-192.png"})}catch(e){}}
function qaLoad(){if(!S.tok)return;api({a:QP+"list",tok:S.tok}).then(function(j){if(!j||!j.ok)return;QA.L=j.L||[];QA.me=j.me;QA.at=Date.now();var av=qaAv(),ids={};av.forEach(function(o){ids[o.id]=1});
if(QA.seen){var fr=av.filter(function(o){return!QA.seen[o.id]});if(fr.length){qaBeep();qaNote("📋 Новое поручение",fr[0].t.slice(0,90));toast("📋 Новое поручение")}}QA.seen=ids;
var now=Date.now();qaMine().forEach(function(o){if(o.st==="taken"&&now>o.due&&!QA.ovd[o.id]){QA.ovd[o.id]=1;qaBeep();qaNote("⏰ Срок поручения истёк",o.t.slice(0,90))}});qaDraw()}).catch(function(){})}
function qaAv(){var me=QA.me||{};return QA.L.filter(function(o){return o.st==="open"&&(o.to||[]).indexOf(me.r)>-1&&(!o.br||o.br===me.br)})}
function qaMine(){var me=QA.me||{};return QA.L.filter(function(o){return o.tk&&o.tk.pk===me.pk})}
function qaHtml(){var av=qaAv(),my=qaMine().filter(function(o){return o.st==="taken"}),dn=qaMine().filter(function(o){return o.st==="done"}).slice(0,3),now=Date.now();if(!QA.at)return"";
var h='<div class="card" style="--c:#8b5cf6"><div class="top"><b>📋 Поручения</b><span class="chip" style="--c:#8b5cf6">'+(av.length?'новых '+av.length:my.length?'в работе '+my.length:'нет новых')+'</span></div>';
my.forEach(function(o){var left=o.due-now,late=left<0;h+='<div style="border-top:1px dashed var(--bd);padding-top:8px;margin-top:8px"><div style="white-space:pre-wrap">'+esc(o.t)+'</div><div class="tmr'+(late?' bad':left<15*6e4?' mid':'')+'" data-qdue="'+o.due+'">'+(late?'⚠ Просрочено на '+qaDur(left/6e4):'⏱ Осталось '+qaDur(left/6e4))+'</div><div class="row"><button class="btn g" data-qaa="done" data-id="'+o.id+'">✔ Выполнено'+(o.ph?' (с фото)':'')+'</button><button class="btn o" data-qaa="drop" data-id="'+o.id+'">Вернуть</button></div></div>'});
av.forEach(function(o){h+='<div style="border-top:1px dashed var(--bd);padding-top:8px;margin-top:8px"><div class="its">от '+esc(o.by.w)+(o.brn?' · 🏢 '+esc(o.brn):'')+' · срок '+qaDur(o.dl)+(o.ph?' · 📷 нужно фото':'')+'</div><div style="white-space:pre-wrap;margin:4px 0">'+esc(o.t)+'</div>'+(now-o.ts>36e5?'<div class="vio">⚠ Ждёт исполнителя больше часа</div>':'')+'<div class="row"><button class="btn" data-qaa="take" data-id="'+o.id+'">✅ Ознакомился — беру</button></div></div>'});
if(!av.length&&!my.length)h+='<p class="its">Новых поручений нет. Когда появятся — прозвучит сигнал.</p>';
dn.forEach(function(o){h+='<div class="its" style="margin-top:6px">✅ '+esc(o.t.slice(0,60))+(o.done.late?' — с опозданием':' — вовремя')+(o.ok?(o.ok.v==="bad"?' · 👎 не принято':' · 👍 принято'):'')+'</div>'});
return h+'</div>'}
function qaDraw(){var b=$("qabox");if(b)b.innerHTML=qaHtml()}
setInterval(function(){var now=Date.now();document.querySelectorAll("[data-qdue]").forEach(function(e){var l=+e.dataset.qdue-now;e.className="tmr"+(l<0?" bad":l<15*6e4?" mid":"");e.textContent=l<0?"⚠ Просрочено на "+qaDur(l/6e4):"⏱ Осталось "+qaDur(l/6e4)})},15000);
setInterval(function(){if(S.tok&&!document.hidden)qaLoad()},30000);document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.tok)qaLoad()});
document.addEventListener("click",function(e){var b=e.target.closest("[data-qaa]");if(!b)return;var k=b.dataset.qaa,id=b.dataset.id,o=QA.L.filter(function(x){return x.id===id})[0];if(!o)return;
var send=function(pl,msg){b.disabled=true;pl.a=QP+k;pl.tok=S.tok;pl.id=id;return api(pl).then(function(j){b.disabled=false;if(!j.ok){toast({taken:"Уже взял другой сотрудник",photo:"Нужно фото",notyours:"Поручение уже не ваше",notfor:"Это поручение не для вас"}[j.error]||"Не получилось: "+j.error);return null}toast(msg);qaLoad();return j}).catch(function(){b.disabled=false;toast("Нет связи")})};
if(k==="take"){if(confirm("Вы ознакомились и берёте поручение в работу?\nСрок: "+qaDur(o.dl)))send({},"Поручение ваше ✓");return}
if(k==="drop"){var w=prompt("Почему возвращаете?");if(w!==null)send({note:w},"Поручение возвращено");return}
QA.ph="";var d=document.createElement("div");d.className="ov";d.innerHTML='<div class="sh"><b style="font-size:19px">✔ Выполнено</b><p class="its" style="white-space:pre-wrap">'+esc(o.t)+'</p><label class="shot"><input type="file" accept="image/*" capture="environment" id="qaph" hidden><span id="qast">📷 '+(o.ph?'Фото (обязательно)':'Фото (по желанию)')+'</span></label><img class="ph" id="qaim" hidden alt="Фото"><label style="margin-top:10px">Комментарий</label><input id="qano" maxlength="250" placeholder="Что сделано"><button class="btn g" id="qago" style="width:100%">Отправить отчёт</button><button class="btn o" id="qacx" style="width:100%;margin-top:8px">Отмена</button></div>';
document.body.appendChild(d);$("qacx").onclick=function(){d.remove()};$("qaph").onchange=function(){var f0=this.files&&this.files[0];if(!f0)return;$("qast").textContent="⏳ Обрабатываем…";shrink(f0).then(function(u){QA.ph=u;$("qaim").src=u;$("qaim").hidden=false;$("qast").textContent="🔄 Переснять"})};
$("qago").onclick=function(){if(o.ph&&!QA.ph){toast("Сделайте фото");return}var x=this;x.disabled=true;x.textContent="⏳ Отправляем…";api({a:QP+"done",tok:S.tok,id:id,photo:QA.ph,note:$("qano").value.trim()}).then(function(j){if(!j.ok){x.disabled=false;x.textContent="Отправить отчёт";toast(j.error==="photo"?"Нужно фото":"Не получилось: "+j.error);return}d.remove();toast("Отчёт отправлен ✓");qaLoad()}).catch(function(){x.disabled=false;toast("Нет связи")})}});

setInterval(function(){if(S.tok&&!document.hidden)load()},60000);
if(S.tok)setTimeout(qaLoad,800);document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.tok)load()});
S.tok?load():login();
</script></body></html>
