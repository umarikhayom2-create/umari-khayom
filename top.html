<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Достижения · Умари Хайём</title><meta name="robots" content="noindex"><meta name="theme-color" content="#b45309">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f3f5fa;--sf:#fff;--sf2:#f1f4f9;--tx:#0f172a;--mut:#5b6675;--bd:#e3e8f0;--gd:#d97706;--gd2:#b45309;--up:#16a34a;--dn:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0d1016;--sf:#161a22;--sf2:#1d222c;--tx:#eef1f6;--mut:#9aa4b2;--bd:#283040}}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 560px at -15% -10%,rgba(124,58,237,.10),transparent 60%),radial-gradient(800px 520px at 115% 5%,rgba(14,165,233,.10),transparent 62%) fixed,var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#f59e0b,#b45309);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{font-size:18px}header small{display:block;opacity:.85;font-size:12.5px}header a{color:#fff;text-decoration:none;font:600 14px system-ui}
main{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.tabs{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--sf2);margin-bottom:12px}.tabs button{flex:1;border:0;border-radius:11px;padding:11px;font:700 14.5px system-ui;background:transparent;color:var(--mut)}.tabs button.on{background:var(--sf);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn{border:0;border-radius:14px;padding:13px 16px;font:700 15px system-ui;background:linear-gradient(135deg,#f59e0b,#b45309);color:#fff;cursor:pointer;text-align:center}.btn.o{background:var(--sf2);color:var(--tx)}.btn:disabled{opacity:.5}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.au{display:flex;gap:10px;align-items:center}.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 17px system-ui;color:#fff;flex:none}
.au b{display:block}.au small{color:var(--mut);font-size:12.5px}
.tx{margin:10px 0;white-space:pre-wrap;word-break:break-word}
.phs{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin:8px 0}.phs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in;background:var(--sf2)}
.tk{display:inline-block;font:600 12.5px system-ui;background:var(--sf2);color:var(--mut);border-radius:99px;padding:5px 10px;margin-bottom:6px}
.sc{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.stars{color:#f59e0b;font-size:20px;letter-spacing:1px}.stars i{font-style:normal;color:var(--bd)}.pts{font:700 13px system-ui;color:var(--mut)}
.bs{margin-top:10px;border-radius:14px;padding:10px 12px;font-weight:700}.bs small{display:block;font-weight:500;color:var(--mut);font-size:12.5px}
.b1{background:#e0f2fe;color:#075985}.b2{background:#fef3c7;color:#92400e}.b3{background:linear-gradient(135deg,#ede9fe,#fce7f3);color:#6d28d9}
@media (prefers-color-scheme:dark){.b1{background:#0c2a3a;color:#7dd3fc}.b2{background:#3a2a0c;color:#fcd34d}.b3{background:#2e1a47;color:#d8b4fe}}
.vt{display:flex;gap:8px;margin-top:10px}.vt button{flex:1;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:12px;padding:10px;font:700 15px system-ui}
.vt button.u{border-color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent);color:var(--up)}.vt button.d{border-color:var(--dn);background:color-mix(in srgb,var(--dn) 10%,transparent);color:var(--dn)}
.gr{display:flex;gap:6px;margin-top:8px}.gr button{flex:1;border:1.5px dashed var(--bd);background:transparent;color:var(--tx);border-radius:12px;padding:9px 4px;font:700 13px system-ui}.gr button.on{border-style:solid;border-color:var(--gd);background:color-mix(in srgb,var(--gd) 14%,transparent)}
.why{margin-top:8px;font-size:13px;color:var(--mut)}.why summary{cursor:pointer;font-weight:600}
.lnk{border:0;background:none;color:var(--mut);font:600 12.5px system-ui;padding:6px 0}
.pod{display:flex;align-items:flex-end;gap:8px;margin:10px 0 14px}.pod div{flex:1;text-align:center;border-radius:16px 16px 6px 6px;padding:10px 6px;color:#fff}
.pod b{display:block;font-size:14px;line-height:1.2;word-break:break-word}.pod small{display:block;font-size:12px;opacity:.9}.pod .md{font-size:30px}
.p1{background:linear-gradient(160deg,#fbbf24,#b45309);min-height:170px}.p2{background:linear-gradient(160deg,#cbd5e1,#64748b);min-height:140px}.p3{background:linear-gradient(160deg,#fdba74,#9a3412);min-height:120px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}.row:first-child{border-top:0}.row .n{width:26px;font-weight:800;color:var(--mut)}.row .w{flex:1;min-width:0}.row small{color:var(--mut)}.me{background:color-mix(in srgb,var(--gd) 10%,transparent);border-radius:10px;padding-left:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}.sh{background:var(--sf);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;font:600 13px system-ui;color:var(--mut);margin:10px 0 4px}textarea,input,select{width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;font:16px system-ui;background:var(--sf);color:var(--tx)}
.shot{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--bd);border-radius:14px;padding:16px;font:700 15px system-ui;cursor:pointer}
.th{display:flex;gap:6px;margin-top:8px}.th img{width:70px;height:70px;object-fit:cover;border-radius:10px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 8px 24px rgba(180,83,9,.4);width:calc(100% - 32px);max-width:520px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.emp{text-align:center;color:var(--mut);padding:30px 10px}.note{font-size:13px;color:var(--mut)}
.bd{width:100%;margin:8px 0 2px;padding:8px 10px;border-radius:12px;background:var(--sf2)}.bd div{display:flex;justify-content:space-between;gap:10px;padding:5px 0}.bd small{display:block;color:var(--mut);font-size:12px}
.rules div{display:flex;gap:10px;padding:6px 0}.rules i{font-style:normal;width:28px;text-align:center;font-size:18px}
</style></head><body>
<div id="app"></div><script src="ld.js?v=2" data-kind="top"></script>
<script>
var CHAT_URL="https://script.google.com/macros/s/AKfycbzxbho2rc1WmpPRcsMGcKcbxdjH4AgJzxaOU_4R8PvEi5_x45vfRO2vP2nXRR5QKojg/exec";
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(t){var e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2800)}
function shrink(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var M=1280,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);var q=.62,d=c.toDataURL("image/jpeg",q);while(d.length>260000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}res(d)};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function pic(id,w){return"https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w"+(w||400)}
function when(ts){var d=new Date(ts),n=new Date(),m=Math.round((n-d)/6e4);if(m<1)return"только что";if(m<60)return m+" мин назад";if(d.toDateString()===n.toDateString())return"сегодня "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);return d.getDate()+"."+("0"+(d.getMonth()+1)).slice(-2)}
/* ---- кто вошёл: сотрудник филиала, курьер или офис ---- */
var AU=null;(function(){var as=new URLSearchParams(location.search).get("as")||"",t={};
try{t.m=localStorage.getItem("tm_tok");t.k=localStorage.getItem("ku_tok");t.t=JSON.parse(localStorage.getItem("uh_adm")||"null")}catch(e){}
var order=as?[as,"m","k","t"]:["m","k","t"];for(var i=0;i<order.length&&!AU;i++){var k=order[i];if(k==="m"&&t.m)AU={p:"m_",tok:t.m,back:"team.html"};if(k==="k"&&t.k)AU={p:"k_",tok:t.k,back:"courier.html"};if(k==="t"&&t.t&&t.t.key)AU={p:"t_",o:t.t,back:"index.html#admin"}}})();
function api(a,pl){pl=pl||{};pl.a=AU.p+a;if(AU.tok)pl.tok=AU.tok;if(AU.o){pl.key=AU.o.key;pl.role=AU.o.role;pl.who=AU.o.who}return fetch(CHAT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(pl)}).then(function(r){return r.json()})}
var S={tab:"feed",feed:[],top:[],me:{},m:"",at:0};
var GR=[null,["👌","Удовлетворительно","b1",5],["⭐","Отлично","b2",15],["💎","Гениально","b3",40]];
var CL=["#f59e0b","#0ea5e9","#8b5cf6","#16a34a","#e11d48","#0d9488","#ea580c","#4f46e5"];
function col(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%997;return CL[h%CL.length]}
function stars(n){var h="";for(var i=0;i<5;i++)h+=i<n?"★":"<i>★</i>";return'<span class="stars">'+h+'</span>'}
function mon(d){return["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"][d.getMonth()]}
function load(m){return api("ds_list",{m:m||S.m}).then(function(j){if(!j||!j.ok){$("app").innerHTML='<div class="emp">'+(j&&j.error==="action"?"Сервер ещё не обновлён — сообщите руководителю.":j&&(j.error==="tok"||j.error==="auth")?'Войдите заново. <a href="'+AU.back+'">Открыть вход</a>':"Не удалось загрузить: "+esc(j&&j.error||"нет связи"))+'</div>';return}
S.feed=j.feed;S.top=j.top;S.best=j.best||[];S.me=j.me;S.m=j.m;S.at=Date.now();try{if(!m)localStorage.setItem("uh_top_c"+AU.p,JSON.stringify({feed:j.feed,top:j.top,best:j.best||[],me:j.me,m:j.m}))}catch(e){}draw()}).catch(function(){if(!S.at)$("app").innerHTML='<div class="emp">Нет связи. Попробуйте ещё раз.</div>'})}
function postHtml(o){var b=o.boss,g=b&&GR[b.lvl];
var h='<div class="card" id="p_'+o.id+'"><div class="au"><span class="av" style="background:'+col(o.by.w)+'">'+esc((o.by.w||"?").trim().charAt(0).toUpperCase())+'</span><div style="flex:1;min-width:0"><b>'+esc(o.by.w)+'</b><small>'+esc(o.by.rn||"")+(o.by.br?" · "+esc(o.by.br):"")+" · "+when(o.c)+'</small></div></div>';
if(o.task)h+='<div style="margin-top:8px"><span class="tk">📋 Поручение: '+esc(o.task.t)+'</span></div>';
h+='<div class="tx">'+esc(o.t)+'</div>';
if(o.ph.length)h+='<div class="phs">'+o.ph.map(function(p){return'<img src="'+pic(p)+'" data-z="'+esc(p)+'" loading="lazy" alt="">'}).join("")+'</div>';
h+='<div class="sc">'+stars(o.st)+'<span class="pts">'+o.pts+' очк.</span></div>';
if(g)h+='<div class="bs '+g[2]+'">'+g[0]+' '+g[1]+' <small>оценка: '+esc(b.w)+(b.c?' — «'+esc(b.c)+'»':'')+'</small></div>';
if(o.by.me)h+='<div class="note" style="margin-top:8px">👍 '+o.up+' · 👎 '+o.dn+' — это ваш пост</div>';
else h+='<div class="vt"><button data-v="1" data-id="'+o.id+'" class="'+(o.my>0?"u":"")+'">👍 '+o.up+'</button><button data-v="-1" data-id="'+o.id+'" class="'+(o.my<0?"d":"")+'">👎 '+o.dn+'</button></div>';
if(S.me.boss&&!o.by.me)h+='<div class="gr">'+[1,2,3].map(function(l){return'<button data-g="'+l+'" data-id="'+o.id+'" class="'+(b&&b.lvl===l?"on":"")+'">'+GR[l][0]+' '+GR[l][1]+'</button>'}).join("")+'</div>';
if(o.why.length)h+='<details class="why"><summary>Почему не понравилось ('+o.why.length+')</summary>'+o.why.map(function(x){return'<div>• <b>'+esc(x.w)+':</b> '+esc(x.t)+'</div>'}).join("")+'</details>';
if(o.by.me||S.me.boss)h+='<button class="lnk" data-del="'+o.id+'">🗑 Удалить</button>';
return h+'</div>'}
function topHtml(){var t=S.top,d=new Date(S.m+"-15"),h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:17px">🏆 Рейтинг за '+mon(d)+'</b><select id="mm" style="width:auto;padding:8px">'+[0,1,2].map(function(k){var x=new Date();x.setDate(1);x.setMonth(x.getMonth()-k);var v=x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2);return'<option value="'+v+'"'+(v===S.m?" selected":"")+'>'+mon(x)+'</option>'}).join("")+'</select></div>';
if(!t.length)return h+'<div class="emp">В этом месяце ещё нет достижений. Будьте первым!</div></div>'+rules();
var p=[t[1],t[0],t[2]],cls=["p2","p1","p3"],md=["🥈","🥇","🥉"];
var BS=S.best||[];h+=(BS.length?'':'');h+='<div class="pod">'+p.map(function(r,i){return r?'<div class="'+cls[i]+'"><span class="md">'+md[i]+'</span><b>'+esc(r.w)+'</b><small>'+r.pts+' очк. · '+r.n+' пост.</small></div>':'<div style="background:var(--sf2);min-height:60px"></div>'}).join("")+'</div>';
h+=t.map(function(r,i){var op=S.open===i;return'<div class="row'+(r.me?" me":"")+'" data-row="'+i+'" style="cursor:pointer;flex-wrap:wrap"><span class="n">'+(i+1)+'</span><div class="w"><b>'+esc(r.w)+(i===0?" — сотрудник месяца":"")+'</b><br><small>'+esc(r.rn||"")+(r.br?" · "+esc(r.br):"")+(r.n?' · '+r.n+' пост.':'')+(r.top?' · 💎×'+r.top:'')+'</small></div><div style="text-align:right"><b>'+r.pts+'</b><br><small>'+(op?"▴":"▾")+'</small></div>'+
(op?'<div class="bd">'+(r.pp?'<div><span>🏆 Посты и голоса</span><b>+'+r.pp+'</b></div>':'')+(r.lines||[]).map(function(x){return'<div><span>'+esc(x.t)+'<small>'+esc(x.l||"")+'</small></span><b>+'+x.p+'</b></div>'}).join("")+((r.pp||(r.lines||[]).length)?'':'<div><span>Пока нет очков</span></div>')+'</div>':'')+'</div>'}).join("");
h+='</div>';if(BS.length)h+='<div class="card"><b style="font-size:17px">🏅 Лучшие по направлениям</b>'+BS.map(function(x){return'<div class="row"><div class="w"><small>'+esc(x.t)+'</small><br><b>'+esc(x.w)+'</b></div><b>+'+x.p+'</b></div>'}).join('')+'</div>';return h+rules()}
function rules(){return(S.me.boss?'<div class="card"><b>📨 Итоги месяца в Telegram</b><p class="note">1-го числа в 10:00 всем сотрудникам, кто подключил Telegram, придут итоги прошлого месяца: тройка лидеров, сотрудник месяца, лучшие по направлениям и личное место каждого.</p><button class="btn o" id="dig" style="width:100%">Отправить мне пример сейчас</button></div>':'')+'<div class="card rules"><b>Как считаются очки</b><div><i>👍</i><span>Лайк коллеги: +1 очко</span></div><div><i>👎</i><span>Дизлайк: −1 очко. Нужно написать, что не так, — так критика полезна, а не обидна</span></div><div><i>👌</i><span>Руководство: «Удовлетворительно» +5</span></div><div><i>⭐</i><span>Руководство: «Отлично» +15</span></div><div><i>💎</i><span>Руководство: «Гениально» +40</span></div><div><i>★</i><span>Звёзды поста: от 5, 15, 30, 50 и 80 очков</span></div><div><i>⏱</i><span>Работа считается сама: 1 очко за каждые 2 часа на смене, +2 за приход вовремя, −2 за опоздание (если руководитель указал график)</span></div><div><i>📋</i><span>Поручения: выполнены, вовремя, с фото</span></div><div><i>🚚</i><span>Курьеры: доставки вовремя и с фото</span></div><div><i>🧺</i><span>Сборка заявок между филиалами: +1 за позицию</span></div><div><i>🛒</i><span>Контент: +3 за товар, +2 если заполнен полностью, +2 если продаётся, +1 за правку</span></div><div><i>💼</i><span>Торговые: +3 за заявку, +5 за нового клиента, бонус за оплату</span></div><div><i>📦</i><span>Операторы: +1 за обработанный заказ, +2 за собранный</span></div><div><i>🥇</i><span>Лучший по очкам за месяц — «Сотрудник месяца». Награду за места определяет руководство</span></div><p class="note">За себя голосовать нельзя. Один голос от каждого, передумать можно. Не больше 3 постов в день.</p></div>'}
function draw(){var h='<header><div><b>🏆 Доска достижений</b><small>'+esc(S.me.w||"")+(S.me.boss?" · руководство":"")+'</small></div><a href="'+AU.back+'">← Назад</a></header><main>';
h+='<div class="tabs"><button data-t="feed" class="'+(S.tab==="feed"?"on":"")+'">Лента</button><button data-t="top" class="'+(S.tab==="top"?"on":"")+'">Рейтинг</button></div>';
h+=S.tab==="feed"?(S.feed.length?S.feed.map(postHtml).join(""):'<div class="emp">Пока пусто. Расскажите о своём лучшем результате первым!</div>'):topHtml();
h+='</main><button class="btn fab" id="new">+ Поделиться достижением</button>';$("app").innerHTML=h;
var mm=$("mm");if(mm)mm.onchange=function(){load(this.value)}}
function upd(p){S.feed=S.feed.map(function(o){return o.id===p.id?p:o});var e=$("p_"+p.id);if(e)e.outerHTML=postHtml(p)}
document.addEventListener("click",function(e){var t=e.target.closest("[data-t],[data-v],[data-g],[data-del],[data-z],[data-row],#new");if(!t)return;var d=t.dataset;
if(d.row!=null){S.open=S.open===+d.row?null:+d.row;draw();return}
if(d.t){S.tab=d.t;if(d.t==="top")load();draw();return}
if(d.z){var v=document.createElement("div");v.className="ov";v.style.alignItems="center";v.innerHTML='<img src="'+pic(d.z,1400)+'" style="max-width:96vw;max-height:90vh;border-radius:12px">';v.onclick=function(){v.remove()};document.body.appendChild(v);return}
